# Vlastní XCFramework llama.cpp s instrukcemi moderních iPhonů.
#
# Oficiální XCFramework se pro iOS překládá bez -march, takže překladač cílí na nejstarší
# arm64 (Apple A7): chybí dotprod a i8mm a ggml pro kvantizované násobení (Q4_K, Q6_K …)
# používá pomalejší obecná NEON jádra. Týká se to i expertů MoE a přebalení husté části
# (`ggml_cpu_has_dotprod()` / `ggml_cpu_has_matmul_int8()` se rozhodují při překladu).
#
# Workflow přeloží stejnou verzi llama.cpp s -march=armv8.6-a+dotprod+i8mm (Apple A15
# a novější – iPhone 13 a výš) a nahraje ji jako Release „llama-cpu-opt-blas-on“, resp.
# „llama-cpu-opt-blas-off“ – obě varianty tak můžou existovat vedle sebe. Který
# XCFramework se použije, se vybírá při ručním spuštění buildu IPA (build.yml).
# Na starších iPhonech by takový build při startu spadl na neznámé instrukci.

name: llama.cpp XCFramework (optimalizovaný)

on:
  workflow_dispatch:
    inputs:
      llama_build:
        description: Verze llama.cpp (tag)
        default: b10894
      arm_arch:
        description: Hodnota GGML_CPU_ARM_ARCH
        default: armv8.6-a+dotprod+i8mm
      blas:
        description: >-
          Backend BLAS (Accelerate). Vypnutím se hustá část a attention přesunou
          při prefillu na Metal místo na CPU – experiment, viz README.
        type: choice
        default: "ON"
        options: ["ON", "OFF", "obojí"]

permissions:
  contents: write

jobs:
  xcframework:
    name: XCFramework (BLAS ${{ matrix.blas }})
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        blas: ${{ fromJSON(inputs.blas == 'obojí' && '["ON","OFF"]' || format('["{0}"]', inputs.blas)) }}
    timeout-minutes: 90
    steps:
      - name: Vybrat Xcode 26
        run: |
          XCODE="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | grep -vi beta | sort -V | tail -1)"
          [ -n "$XCODE" ] || XCODE="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      - name: Stáhnout llama.cpp
        run: git clone --depth 1 --branch "${{ inputs.llama_build }}" https://github.com/ggml-org/llama.cpp.git

      - name: Přidat -march do buildu pro iPhone
        working-directory: llama.cpp
        run: |
          # Jen zařízení – simulátor běží na Macu runneru a instrukce tam řeší jinak.
          perl -0pi -e 's/(build_ios_device\(\) \{.*?-DCMAKE_SYSTEM_NAME=iOS \\\n)/$1        -DGGML_CPU_ARM_ARCH=${{ inputs.arm_arch }} \\\n/s' build-xcframework.sh
          grep -n "GGML_CPU_ARM_ARCH" build-xcframework.sh || { echo "::error::Úprava build-xcframework.sh selhala"; exit 1; }

      - name: Nastavit GGML_BLAS
        if: matrix.blas == 'OFF'
        working-directory: llama.cpp
        run: |
          # Bez BLAS backendu nemá scheduler kam poslat hustou část a attention na CPU,
          # takže je při prefillu (dávka >= 32 tokenů) vezme Metal přes op_offload.
          # Týká se všech cílů, ne jen zařízení – simulátor musí odpovídat.
          perl -0pi -e 's/(-DCMAKE_SYSTEM_NAME=(?:iOS|tvOS|visionOS|watchOS|Darwin) \\\n)/$1        -DGGML_BLAS=OFF \\\n/g' build-xcframework.sh
          grep -c "GGML_BLAS=OFF" build-xcframework.sh

      - name: Build
        working-directory: llama.cpp
        run: ./build-xcframework.sh ios-device ios-sim

      - name: Ověřit instrukce v binárce
        working-directory: llama.cpp
        run: |
          BIN="build-apple/llama.xcframework/ios-arm64/llama.framework/llama"
          # vdotq/vmmlaq se přeloží na instrukce SDOT/USDOT – bez nich by build nic nezměnil.
          if xcrun otool -tV "$BIN" | grep -qiE "\bsdot\b|\busdot\b"; then
            echo "dotprod/i8mm instrukce nalezeny"
          else
            echo "::error::V binárce nejsou instrukce dotprod – -march se neprojevil"
            exit 1
          fi

      - name: Zabalit a nahrát jako Release
        working-directory: llama.cpp/build-apple
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ditto -c -k --sequesterRsrc --keepParent llama.xcframework llama.xcframework.zip
          NOTES="llama.cpp ${{ inputs.llama_build }} · GGML_CPU_ARM_ARCH=${{ inputs.arm_arch }} · GGML_BLAS=${{ matrix.blas }}"
          TAG="llama-cpu-opt-blas-$(tr '[:upper:]' '[:lower:]' <<<"${{ matrix.blas }}")"
          gh release delete "$TAG" --repo "${{ github.repository }}" --yes --cleanup-tag || true
          gh release create "$TAG" llama.xcframework.zip \
            --repo "${{ github.repository }}" \
            --title "llama.cpp XCFramework (optimalizovaný, BLAS ${{ matrix.blas }})" \
            --notes "$NOTES" --prerelease
          echo "$NOTES → Release $TAG" >> "$GITHUB_STEP_SUMMARY"
