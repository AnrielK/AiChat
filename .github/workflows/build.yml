# Nepodepsaná IPA AI Chatu na GitHub Actions.
#
# Build běží přes ./make-ipa.sh – stejně jako lokálně, včetně kontrol
# (arm64, llama.framework, Metal shadery). IPA najdeš v artefaktech běhu,
# u tagu v* se přiloží i k GitHub Release. Podpis řeší až sideload.

name: Build IPA
run-name: Build IPA · ${{ inputs.configuration || 'Release' }} · llama.cpp ${{ inputs.llama || 'automaticky' }}

# Build se spouští jen ručně (Actions › Build IPA › Run workflow), nebo tagem v* pro Release.
# Push na main ani pull request build nespouští – na macOS runneru se minuty počítají.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      configuration:
        description: Konfigurace
        type: choice
        options: [Release, Debug]
        default: Release
      llama:
        description: >-
          llama.cpp XCFramework. Zkompilované varianty vytváří workflow
          „llama.cpp XCFramework (optimalizovaný)“ – když vybraná neexistuje, build hned skončí.
        type: choice
        default: automaticky
        options:
          - automaticky
          - originální b10894
          - b10894 · GGML_CPU_ARM_ARCH=armv8.6-a+dotprod+i8mm · GGML_BLAS=ON
          - b10894 · GGML_CPU_ARM_ARCH=armv8.6-a+dotprod+i8mm · GGML_BLAS=OFF

# Druhý ručně spuštěný build na stejné větvi zruší ten rozběhnutý.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write   # jen kvůli přiložení IPA k Release u tagu

env:
  CONFIGURATION: ${{ inputs.configuration || 'Release' }}

jobs:
  ios:
    name: iOS (${{ inputs.configuration || 'Release' }})
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Číslo buildu je počet commitů a marketingová verze se bere z tagu v* –
          # s mělkým klonem (výchozí depth 1) by vyšlo 1 a tag by se nenašel.
          fetch-depth: 0

      # Varianta llama.cpp podle výběru. Zkompilované leží v Releases „llama-cpu-opt-blas-on“
      # a „llama-cpu-opt-blas-off“ (workflow llama-xcframework.yml); starší Release „llama-cpu-opt“
      # se použije, když odpovídá vybranému BLAS. Package.swift pozná zkompilovanou variantu
      # podle složky Packages/LlamaCpp/llama.xcframework, bez ní vezme oficiální XCFramework.
      # „automaticky“ (i u tagu) = zkompilovaná s BLAS ON, když existuje, jinak oficiální.
      - name: Vybrat llama.cpp
        env:
          GH_TOKEN: ${{ github.token }}
          CHOICE: ${{ inputs.llama || 'automaticky' }}
        run: |
          OFFICIAL="$(grep -oE 'download/b[0-9]+' Packages/LlamaCpp/Package.swift | head -1 | cut -d/ -f2)"
          case "$CHOICE" in
            *"GGML_BLAS=ON"*)  WANT=ON ;;
            *"GGML_BLAS=OFF"*) WANT=OFF ;;
            originální*)       WANT=official ;;
            *)                 WANT=auto ;;
          esac

          # Stáhne XCFramework z Release $1, když jeho BLAS odpovídá $2.
          # Starší Release bez údaje o BLAS byl přeložený s výchozím ON.
          use_release() {
            local tag="$1" blas="$2" notes actual
            notes="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json body -q .body 2>/dev/null)" || return 1
            actual="$(grep -oE 'GGML_BLAS=(ON|OFF)' <<<"$notes" | head -1 | cut -d= -f2)"
            [ "${actual:-ON}" = "$blas" ] || return 1
            rm -rf /tmp/llama Packages/LlamaCpp/llama.xcframework
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern llama.xcframework.zip -D /tmp/llama || return 1
            ditto -x -k /tmp/llama/llama.xcframework.zip Packages/LlamaCpp/
            [ -d Packages/LlamaCpp/llama.xcframework ] || { echo "::error::V Release $tag chybí llama.xcframework"; exit 1; }
            LLAMA_BUILD="${notes#llama.cpp }"
            case "$LLAMA_BUILD" in *GGML_BLAS=*) ;; *) LLAMA_BUILD="$LLAMA_BUILD · GGML_BLAS=ON" ;; esac
            echo "Release $tag"
          }

          compiled() {
            local tag="llama-cpu-opt-blas-$(tr '[:upper:]' '[:lower:]' <<<"$1")"
            use_release "$tag" "$1" || use_release llama-cpu-opt "$1"
          }

          LLAMA_BUILD=""
          case "$WANT" in
            ON|OFF)
              if ! compiled "$WANT"; then
                echo "::error::Zkompilovaný llama.cpp s GGML_BLAS=$WANT neexistuje. Spusť nejdřív workflow „llama.cpp XCFramework (optimalizovaný)“ s blas=$WANT, nebo vyber originální."
                exit 1
              fi
              # Popisek ve výběru je napevno – když Release nese jinou verzi, ať je to vidět.
              LABEL_VER="$(grep -oE 'b[0-9]+' <<<"$CHOICE" | head -1 || true)"
              REAL_VER="$(grep -oE 'b[0-9]+' <<<"$LLAMA_BUILD" | head -1 || true)"
              if [ -n "$LABEL_VER" ] && [ -n "$REAL_VER" ] && [ "$LABEL_VER" != "$REAL_VER" ]; then
                echo "::warning::Vybráno $LABEL_VER, zkompilovaný Release je ale $REAL_VER – použije se $REAL_VER."
              fi
              ;;
            auto)
              compiled ON || true
              ;;
          esac
          if [ -z "$LLAMA_BUILD" ]; then
            rm -rf Packages/LlamaCpp/llama.xcframework
            LLAMA_BUILD="$OFFICIAL (oficiální)"
          fi

          echo "llama.cpp: $LLAMA_BUILD"
          echo "LLAMA_BUILD=$LLAMA_BUILD" >> "$GITHUB_ENV"
          echo "**llama.cpp:** $LLAMA_BUILD" >> "$GITHUB_STEP_SUMMARY"

      # iOS 26 SDK (Liquid Glass, FoundationModels) je jen v Xcode 26+.
      # Vybere nejnovější stabilní Xcode 26.x, betu jen když jiný není.
      - name: Vybrat Xcode 26
        run: |
          XCODE="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | grep -vi beta | sort -V | tail -1)"
          [ -n "$XCODE" ] || XCODE="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)"
          if [ -z "$XCODE" ]; then
            echo "::error::Na runneru není Xcode 26."
            ls -d /Applications/Xcode*.app
            exit 1
          fi
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      # MLX kompiluje Metal shadery a od Xcode 26 je Metal toolchain samostatná komponenta.
      - name: Metal toolchain
        run: |
          if ! xcrun metal -v >/dev/null 2>&1; then
            xcodebuild -downloadComponent MetalToolchain || sudo xcodebuild -downloadComponent MetalToolchain
          fi
          xcrun metal -v

      # mlx-swift-lm, mlx-swift, swift-transformers a XCFramework llama.cpp (~90 MB).
      - name: Cache Swift balíčků
        uses: actions/cache@v4
        with:
          path: .build/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('AIChat.xcodeproj/project.pbxproj', 'Packages/**/Package.swift', '**/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Build
        run: |
          chmod +x make-ipa.sh
          set -o pipefail
          # Stejné číslo, jaké si spočítá skript – jen pro pojmenování artefaktu.
          echo "BUILD_NUMBER=$(git rev-list --count HEAD)" >> "$GITHUB_ENV"
          ./make-ipa.sh "$CONFIGURATION" 2>&1 | tee build.log

      - name: Souhrn
        if: always()
        run: |
          {
            if [ -f "$IPA_NAME" ]; then
              echo "### ✓ $IPA_NAME ($(du -h "$IPA_NAME" | cut -f1), $CONFIGURATION)"
              echo
              echo "$(xcodebuild -version | head -1) · commit \`${GITHUB_SHA::7}\`"
              # Řádek „▸ verze …“ ze skriptu – stejné číslo, jaké je v IPA.
              grep -m1 "▸ verze" build.log 2>/dev/null | sed 's/▸ /**/; s/$/**/' || true
              RESOLVED="AIChat.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved"
              if [ -f "$RESOLVED" ]; then
                echo
                echo "**Verze balíčků**"
                echo
                python3 -c "import json,sys; [print(f'- {p[\"identity\"]} {p[\"state\"].get(\"version\") or p[\"state\"].get(\"revision\",\"\")[:7]}') for p in json.load(open(sys.argv[1]))['pins']]" "$RESOLVED" || true
              fi
              # Varování ze skriptu (⚠︎) – build prošel, ale něco nemusí fungovat.
              if grep -q "⚠︎" build.log 2>/dev/null; then
                echo
                echo "**Varování**"
                echo '```'
                grep "⚠︎" build.log
                echo '```'
              fi
            else
              echo "### ✕ Build selhal"
              echo
              echo '```'
              # Chyby kompilátoru a neúspěšné kontroly skriptu, bez duplicit.
              grep -E "error:|✕" build.log 2>/dev/null | awk '!seen[$0]++' | head -60 || echo "(build.log chybí – selhal krok před buildem)"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Nahrát IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AIChat-${{ env.CONFIGURATION }}-b${{ env.BUILD_NUMBER }}
          path: ${{ env.IPA_NAME }}
          retention-days: 30
          if-no-files-found: error

      # Package.resolved z běhu – když ho commitneš, CI i lokální build použijí stejné verze balíčků.
      - name: Nahrát build log a Package.resolved
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.sha }}
          path: |
            build.log
            AIChat.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
          retention-days: 14
          if-no-files-found: ignore

      - name: GitHub Release
        if: success() && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.IPA_NAME }}
          generate_release_notes: true
